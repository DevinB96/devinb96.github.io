<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Maquette still renderer</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  // Renders one still of the maquette and exposes it as WebP data URLs (full size and half size).
  import { renderStill } from '../src/assets/js/maquette.js';
  const q = new URLSearchParams(location.search);
  const width = +q.get('w') || 1600, height = +q.get('h') || 1200;
  const canvas = document.getElementById('c');
  canvas.width = width; canvas.height = height;
  // Composite onto the same soft backdrop the live section uses, so stills match the 3D view.
  renderStill(canvas, { view: q.get('view'), level: q.get('level') || 'regular', width, height, scene: q.get('scene') || 'home' });
  const out = document.createElement('canvas');
  out.width = width; out.height = height;
  const x = out.getContext('2d');
  const g = x.createRadialGradient(width * 0.6, height * 0.3, 0, width * 0.6, height * 0.3, Math.max(width, height) * 0.9);
  g.addColorStop(0, '#f7f4ee'); g.addColorStop(0.7, '#e6e9e3'); g.addColorStop(1, '#dce1da');
  x.fillStyle = g; x.fillRect(0, 0, width, height);
  x.drawImage(canvas, 0, 0);
  const half = document.createElement('canvas');
  half.width = width / 2; half.height = height / 2;
  const hx = half.getContext('2d');
  hx.imageSmoothingQuality = 'high';
  hx.drawImage(out, 0, 0, half.width, half.height);
  window.__result = { full: out.toDataURL('image/webp', 0.84), half: half.toDataURL('image/webp', 0.84), jpeg: out.toDataURL('image/jpeg', 0.86) };
</script>
</body>
</html>
